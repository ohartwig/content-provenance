<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Content">
    <h1><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:dashboard.title" /></h1>
    <p class="text-body-secondary"><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:dashboard.description" /></p>

    <div class="row mb-4">
        <div class="col-sm-3"><div class="card text-center"><div class="card-body"><h3>{auditEntries -> f:count()}</h3><small><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:summary.auditEntries" /></small></div></div></div>
        <div class="col-sm-3"><div class="card text-center"><div class="card-body"><h3>{signedTables -> f:count()}</h3><small><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:summary.signedTables" /></small></div></div></div>
    </div>

    <h2><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:auditLog.title" /></h2>
    <f:if condition="{auditEntries}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:table.tableName" /></th>
                        <th><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:table.uid" /></th>
                        <th><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:table.action" /></th>
                        <th><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:table.created" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{auditEntries}" as="entry">
                        <tr>
                            <td>{entry.contentTable}</td>
                            <td>{entry.contentUid}</td>
                            <td><span class="badge bg-secondary">{entry.action.value}</span></td>
                            <td><f:format.date format="d.m.Y H:i">{entry.performedAt}</f:format.date></td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else><div class="callout callout-info"><f:translate key="LLL:EXT:content_provenance/Resources/Private/Language/locallang.xlf:auditLog.empty" /></div></f:else>
    </f:if>
</f:section>
</html>
